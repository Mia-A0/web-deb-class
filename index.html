<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mia Accola Card</title>
  <style>
    body {
      background-color: #141414;
      font-family: 'Inter', sans-serif;
      color: white;
      display: flex;
      height: 100vh;
      margin: 0;
       justify-content: center;
      align-items: center;
    }

    .card {
      background-color: #1f1f1f;
        text-align: center;
      padding: 2rem;
      border-radius: 10px;
      width: 320px;
    }

    .card img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 1rem;
    }

    .card h2 {
      font-size: 1.3rem;
      margin: 0.5rem 0 0;
    }

    .card p.place {
      color: #ef98bc;
      margin-bottom: 1rem;
      font-size: 0.9rem;
    }

    .card p.bottom {
      color: #bfbfbf;
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
      font-style: italic;
    }

    .card a {
      display: block;
      background-color: #333333;
      color: white;
      text-decoration: none;
      margin: 0.5rem 0;
      padding: 0.75rem;
      border-radius: 8px;
      font-weight: 600;
      transition: background 0.3s ease;
    }

    .card a:hover {
      background-color: #ef98bc;;
      color: #1f1f1f;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="assets/images/96509C86-1DA3-4EF8-9E11-12C32DA2C840_1_201_a.jpeg" alt="Profile Picture">
    <h2>Mia Accola</h2>
    <p class="place">Fort Myers, Fl</P>
    <p class="bottom">"Front-end developer and Gamer."</p>
    <a href="#">GitHub</a>
    <a href="#">Frontend Mentor</a>
    <a href="#">Snapchat</a>
    <a href="#">Tiktok</a>
    <a href="#">Instagram</a>
  </div>
</body>
</html>
